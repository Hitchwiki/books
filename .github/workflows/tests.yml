name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Python dependencies
        run: pip install -r requirements-ci.txt
      - name: JavaScript dependencies
        run: npm ci
      - name: Install Pandoc
        run: |
          ver=3.10.2
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/${ver}/pandoc-${ver}-linux-amd64.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Web reader E2E tests
        run: make e2e
