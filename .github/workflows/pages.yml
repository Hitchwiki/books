name: Build and deploy books

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pandoc and WeasyPrint libs
        run: sudo apt-get update && sudo apt-get install -y pandoc libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev libharfbuzz0b libpangoft2-1.0-0
      - name: Cache book images
        uses: actions/cache@v4
        with:
          path: |
            books/*/images/*.jpg
            cache/book-images.tar.gz
          key: book-images-${{ hashFiles('books/*/images/images.json') }}
          restore-keys: |
            book-images-
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Restore images
        env:
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          IMAGES_RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/images/book-images.tar.gz
          GITHUB_TOKEN: ${{ github.token }}
        run: make images
      - name: Build
        run: make all
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
