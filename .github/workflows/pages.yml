name: Build and deploy books

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - AGENTS.md
      - EDITORIAL.md
      - LICENSE
      - PUBLISH.md
      - SOURCES.md
      - requirements.txt
      - "books/*/DESIGN.md"
      - "books/*/EDITORIAL.md"
      - "books/*/LICENSE"
      - "books/*/README.md"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  book:
    name: Book · ${{ matrix.book }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        book:
          - hitchhikers-guide
          - dumpster-diving
          - random-roads
          - dumpsterdam
          - geldloos
          - hospitality-exchange
          - moneyless
          - sin-dinero
          - shoestring-nomad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Restore built books
        id: book-output-cache
        uses: actions/cache@v4
        with:
          path: |
            build/site/${{ matrix.book }}
            build/site/downloads/${{ matrix.book }}-*
          key: book-output-v2-${{ matrix.book }}-${{ hashFiles(format('books/{0}/**', matrix.book), 'scripts/build_book.py', 'scripts/common.py', 'scripts/editorial.py', 'scripts/themes.py', 'scripts/titles.py', 'scripts/toc.py', 'scripts/ui_strings.py', 'scripts/wiki_links.py', 'assets/book.css', 'assets/covers/**', 'assets/fonts/**', 'assets/logos/**', 'assets/photos/**', 'requirements-ci.txt') }}
      - name: Install pandoc
        if: steps.book-output-cache.outputs.cache-hit != 'true'
        run: |
          ver=3.10.2
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/${ver}/pandoc-${ver}-linux-amd64.tar.gz" \
            | sudo tar -xz --strip-components=1 -C /usr/local
          pandoc --version | head -1
      - name: Cache book images
        if: steps.book-output-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            books/*/images/*.jpg
            cache/book-images.tar.gz
          key: book-images-${{ hashFiles('books/*/images/images.json') }}
          restore-keys: |
            book-images-
      - name: Python deps
        if: steps.book-output-cache.outputs.cache-hit != 'true'
        run: pip install -r requirements-ci.txt
      - name: Restore images
        if: steps.book-output-cache.outputs.cache-hit != 'true'
        env:
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          IMAGES_RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/images/book-images.tar.gz
          GITHUB_TOKEN: ${{ github.token }}
        run: make images
      - name: Build HTML, EPUB, and PDF
        if: steps.book-output-cache.outputs.cache-hit != 'true'
        run: make "${{ matrix.book }}"
      - name: Package book output
        uses: actions/upload-artifact@v4
        with:
          name: book-${{ matrix.book }}
          path: |
            build/site/${{ matrix.book }}
            build/site/downloads/${{ matrix.book }}-*
          if-no-files-found: error
          retention-days: 1

  catalog:
    needs: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Python deps
        run: pip install -r requirements-ci.txt
      - name: Assemble book outputs
        uses: actions/download-artifact@v4
        with:
          pattern: book-*
          path: build/site
          merge-multiple: true
      - name: Build catalog
        run: make catalog
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: catalog
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
